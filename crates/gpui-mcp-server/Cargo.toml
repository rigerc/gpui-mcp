[package]
name = "gpui-mcp-server"
description = "MCP stdio server for GPUI application automation"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true

[[bin]]
name = "gpui-mcp"
path = "src/main.rs"
doc = false

[dependencies]
anyhow.workspace = true
base64.workspace = true
bytes.workspace = true
clap.workspace = true
gpui-mcp-capture = { path = "../gpui-mcp-capture" }
gpui-mcp-protocol = { path = "../gpui-mcp-protocol" }
image.workspace = true
interprocess.workspace = true
mp4.workspace = true
openh264.workspace = true
rmcp.workspace = true
schemars.workspace = true
serde.workspace = true
serde_json.workspace = true
sysinfo.workspace = true
tempfile.workspace = true
tokio.workspace = true
tokio-util.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
ashpd = { version = "=0.13.13", default-features = false, features = ["async-io", "screenshot"] }
bitflags = "2.13.0"
libc = "0.2"
rustix = { version = "1.1.4", default-features = false, features = ["event", "fs", "std"] }
url = "=2.5.8"
wayland-backend = "0.3.15"
wayland-client = "0.31.14"
wayland-scanner = "0.31.10"

[lints]
workspace = true
